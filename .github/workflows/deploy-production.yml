name: Production deployment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      ${{
        vars.ENABLE_PRODUCTION_DEPLOYMENT == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.GCP_CLOUD_RUN_SERVICE_ACCOUNT }}
      GCP_VPC_NETWORK: ${{ vars.GCP_VPC_NETWORK }}
      GCP_VPC_SUBNET: ${{ vars.GCP_VPC_SUBNET }}
      GCP_WORKER_VM: ${{ vars.GCP_WORKER_VM }}
      GCP_WORKER_ZONE: ${{ vars.GCP_WORKER_ZONE }}
      PRODUCTION_SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate deployment configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          required=(
            GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPOSITORY
            GCP_CLOUD_RUN_SERVICE GCP_CLOUD_RUN_SERVICE_ACCOUNT
            GCP_VPC_NETWORK GCP_VPC_SUBNET GCP_WORKER_VM GCP_WORKER_ZONE
            PRODUCTION_SITE_URL GCP_WORKLOAD_IDENTITY_PROVIDER
            GCP_DEPLOY_SERVICE_ACCOUNT VERCEL_TOKEN VERCEL_ORG_ID
            VERCEL_PROJECT_ID RELEASE_SHA
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production setting: ${name}" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: ">= 495.0.0"

      - name: Build and publish backend image
        run: |
          registry="${GCP_REGION}-docker.pkg.dev"
          image_uri="${registry}/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/kora-backend:${RELEASE_SHA}"
          gcloud auth configure-docker "${registry}" --quiet
          docker build --file backend/Dockerfile --tag "${image_uri}" .
          docker push "${image_uri}"
          echo "KORA_BACKEND_IMAGE=${image_uri}" >> "${GITHUB_ENV}"

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy "${GCP_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --platform=managed \
            --image="${KORA_BACKEND_IMAGE}" \
            --service-account="${GCP_CLOUD_RUN_SERVICE_ACCOUNT}" \
            --allow-unauthenticated \
            --port=8080 \
            --startup-probe="httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=0,failureThreshold=12,timeoutSeconds=3,periodSeconds=5" \
            --liveness-probe="httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=10,failureThreshold=3,timeoutSeconds=3,periodSeconds=30" \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=40 \
            --timeout=60 \
            --min=0 \
            --max=3 \
            --network="${GCP_VPC_NETWORK}" \
            --subnet="${GCP_VPC_SUBNET}" \
            --vpc-egress=private-ranges-only \
            --set-env-vars="APP_ENV=production,LOG_LEVEL=INFO,API_CORS_ORIGINS=${PRODUCTION_SITE_URL},NEXT_INTERNAL_BASE_URL=${PRODUCTION_SITE_URL}" \
            --set-secrets="DATABASE_URL=kora-database-url:latest,SUPABASE_URL=kora-supabase-url:latest,SUPABASE_PUBLISHABLE_KEY=kora-supabase-publishable-key:latest,SUPABASE_SERVICE_ROLE_KEY=kora-supabase-service-role-key:latest,SUPABASE_JWT_SECRET=kora-supabase-jwt-secret:latest,REDIS_URL=kora-redis-url:latest,CELERY_BROKER_URL=kora-redis-url:latest,CELERY_RESULT_BACKEND=kora-redis-result-url:latest,KORA_INTERNAL_WORKER_SECRET=kora-internal-worker-secret:latest" \
            --quiet

          api_url="$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" --region="${GCP_REGION}" --format='value(status.url)')"
          echo "KORA_API_URL=${api_url}" >> "${GITHUB_ENV}"

      - name: Verify Cloud Run API
        run: |
          health_json="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 "${KORA_API_URL}/health")"
          ready_json="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 "${KORA_API_URL}/ready")"
          jq -e '.status == "ok"' <<< "${health_json}" > /dev/null
          jq -e '.status == "ready"' <<< "${ready_json}" > /dev/null

      - name: Update worker VM
        run: |
          gcloud compute scp \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_WORKER_ZONE}" \
            --tunnel-through-iap \
            deploy/worker/docker-compose.yml \
            deploy/worker/deploy.sh \
            "${GCP_WORKER_VM}:/tmp/"

          gcloud compute ssh "${GCP_WORKER_VM}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_WORKER_ZONE}" \
            --tunnel-through-iap \
            --command="sudo mkdir -p /opt/kora && sudo cp /tmp/docker-compose.yml /opt/kora/docker-compose.yml && sudo cp /tmp/deploy.sh /opt/kora/deploy.sh && sudo bash /opt/kora/deploy.sh '${KORA_BACKEND_IMAGE}'"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Pull Vercel production settings
        run: npx --yes vercel@58.9.0 pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build frontend deployment
        run: npx --yes vercel@58.9.0 build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy frontend to Vercel
        run: |
          deployment_url="$(npx --yes vercel@58.9.0 deploy --prebuilt --prod --token="${VERCEL_TOKEN}")"
          echo "VERCEL_DEPLOYMENT_URL=${deployment_url}" >> "${GITHUB_ENV}"
          echo "### Production release" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Commit: ${RELEASE_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- API: ${KORA_API_URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Frontend: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify frontend
        run: curl --fail --silent --show-error --retry 8 --retry-delay 5 "${VERCEL_DEPLOYMENT_URL}/" > /dev/null
