name: Production database migration

on:
  workflow_dispatch:
    inputs:
      backup_confirmation:
        description: Type RESTORABLE BACKUP CONFIRMED
        required: true
        type: string
      migration_confirmation:
        description: Type APPLY PRODUCTION MIGRATIONS
        required: true
        type: string

concurrency:
  group: production-database-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    if: >-
      ${{
        inputs.backup_confirmation == 'RESTORABLE BACKUP CONFIRMED' &&
        inputs.migration_confirmation == 'APPLY PRODUCTION MIGRATIONS'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-database
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      KORA_APPROVE_PRODUCTION_DB_PUSH: I approve production db push for gcunbxduzixilquodcow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate migration safety
        run: npm run db:migration:safety

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3

      - name: Validate database credentials
        run: |
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" || -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "Supabase production secrets are not configured." >&2
            exit 1
          fi

      - name: Link production project
        run: supabase link --project-ref gcunbxduzixilquodcow --password "${SUPABASE_DB_PASSWORD}"

      - name: Show pending migrations
        run: supabase migration list --linked

      - name: Apply production migrations
        run: npm run db:push:production

      - name: Verify database schema
        run: supabase db lint --linked
