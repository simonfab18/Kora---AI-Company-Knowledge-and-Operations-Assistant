services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.example
      - .env.local
    environment:
      BACKGROUND_TASK_BACKEND: local
      NEXT_INTERNAL_BASE_URL: http://host.docker.internal:3000
    volumes:
      - ./backend/app:/app/backend/app
    ports:
      - "8000:8000"
