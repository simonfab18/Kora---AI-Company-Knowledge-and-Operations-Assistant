name: Production rollback

on:
  workflow_dispatch:
    inputs:
      backend_image_tag:
        description: Previously healthy 40-character commit SHA
        required: true
        type: string
      vercel_deployment_url:
        description: Previously healthy HTTPS vercel.app deployment URL
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK PRODUCTION
        required: true
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    if: ${{ inputs.confirmation == 'ROLLBACK PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_WORKER_VM: ${{ vars.GCP_WORKER_VM }}
      GCP_WORKER_ZONE: ${{ vars.GCP_WORKER_ZONE }}
      VERCEL_SCOPE: simon-project2
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ROLLBACK_IMAGE_TAG: ${{ inputs.backend_image_tag }}
      ROLLBACK_VERCEL_URL: ${{ inputs.vercel_deployment_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate rollback targets
        run: |
          if [[ ! "${ROLLBACK_IMAGE_TAG}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Backend image tag must be a full 40-character commit SHA." >&2
            exit 1
          fi
          if [[ ! "${ROLLBACK_VERCEL_URL}" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo "Vercel rollback target must be an HTTPS vercel.app deployment URL." >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: ">= 495.0.0"

      - name: Restore backend API and worker
        run: |
          image_uri="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/kora-backend:${ROLLBACK_IMAGE_TAG}"
          gcloud artifacts docker images describe "${image_uri}" --quiet
          gcloud run services update "${GCP_CLOUD_RUN_SERVICE}" --region="${GCP_REGION}" --image="${image_uri}" --quiet
          gcloud compute ssh "${GCP_WORKER_VM}" \
            --project="${GCP_PROJECT_ID}" \
            --zone="${GCP_WORKER_ZONE}" \
            --tunnel-through-iap \
            --command="sudo bash /opt/kora/deploy.sh '${image_uri}'"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore frontend deployment
        run: npx --yes vercel@58.9.0 promote "${ROLLBACK_VERCEL_URL}" --yes --scope="${VERCEL_SCOPE}" --token="${VERCEL_TOKEN}"

      - name: Record rollback
        run: |
          echo "### Production rollback" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Backend image tag: ${ROLLBACK_IMAGE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Frontend deployment: ${ROLLBACK_VERCEL_URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Database rollback is intentionally separate and must use the reviewed migration-specific rollback file." >> "${GITHUB_STEP_SUMMARY}"
