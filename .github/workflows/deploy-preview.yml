name: Preview deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    if: >-
      ${{
        vars.ENABLE_PREVIEW_DEPLOYMENT == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:frontend

      - name: Pull Vercel preview settings
        run: npx --yes vercel@58.9.0 pull --yes --environment=preview --scope="${VERCEL_ORG_ID}" --token="${VERCEL_TOKEN}"

      - name: Build preview
        run: npx --yes vercel@58.9.0 build --scope="${VERCEL_ORG_ID}" --token="${VERCEL_TOKEN}"

      - name: Deploy preview
        run: |
          deployment_url="$(npx --yes vercel@58.9.0 deploy --prebuilt --scope="${VERCEL_ORG_ID}" --token="${VERCEL_TOKEN}")"
          echo "### Preview deployment" >> "${GITHUB_STEP_SUMMARY}"
          echo "- URL: ${deployment_url}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Commit: ${{ github.event.pull_request.head.sha }}" >> "${GITHUB_STEP_SUMMARY}"
