name: kora-worker

services:
  worker:
    image: ${KORA_BACKEND_IMAGE:?KORA_BACKEND_IMAGE is required}
    command:
      - sh
      - -c
      - |
        export REDIS_URL="redis://:$${REDIS_PASSWORD}@redis:6379/0"
        export CELERY_BROKER_URL="redis://:$${REDIS_PASSWORD}@redis:6379/0"
        export CELERY_RESULT_BACKEND="redis://:$${REDIS_PASSWORD}@redis:6379/1"
        exec celery -A app.worker.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - ${KORA_WORKER_ENV_FILE:-/etc/kora/worker.env}
    environment:
      APP_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "CELERY_BROKER_URL=redis://:$${REDIS_PASSWORD}@redis:6379/0 CELERY_RESULT_BACKEND=redis://:$${REDIS_PASSWORD}@redis:6379/1 celery -A app.worker.celery_app inspect ping --timeout=5 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kora-internal

  redis:
    image: redis:7.4-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    restart: unless-stopped
    env_file:
      - ${KORA_WORKER_ENV_FILE:-/etc/kora/worker.env}
    ports:
      - "${KORA_REDIS_BIND_ADDRESS:-0.0.0.0}:${KORA_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kora-internal

networks:
  kora-internal:
    driver: bridge

volumes:
  redis-data:
